services:
  postgres:
    image: postgres:15-alpine
    container_name: campus_connect_db
    environment:
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus_password_secure
      POSTGRES_DB: campus_connect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
